{% extends "base.html" %}
{% block content %}
<style>
  .add-form-card {
    background: linear-gradient(180deg, #eadbfb 0%, #e5d4f8 100%);
    border: 1px solid #dcbef0;
    border-radius: 22px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 16px 30px rgba(62, 11, 99, 0.08);
  }
  .add-form-grid label,
  .add-form-stack > label {
    gap: 8px;
    color: #3f2265;
    font-weight: 700;
  }
  .add-form-grid input,
  .add-form-grid select,
  .add-form-stack textarea {
    background: #fffdfd;
  }
  .add-form-actions {
    justify-content: flex-end;
  }
</style>
<div class="page-head">
  <div>
    <h1>Add vendor</h1>
    <p>Create a new vendor profile.</p>
  </div>
  <a class="btn ghost js-back-button" href="{{ url_for('vendors') }}" data-fallback="{{ url_for('vendors') }}">Back</a>
</div>

<section class="card add-form-card">
  <form class="stack add-form-stack" method="post">
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <div class="grid two add-form-grid">
      <label>
        Vendor ID
        <input type="text" value="{{ vendor_code }}" readonly>
      </label>
      <label>
        Vendor name
        <input type="text" name="name" required>
      </label>
      <label>
        Phone
        <input type="text" name="phone" inputmode="tel" pattern="^\+?[0-9]+$" oninput="this.value=this.value.replace(/[^0-9+]/g,'').replace(/(?!^)\+/g,'');" required>
      </label>
      <label>
        Email
        <input type="email" name="email">
      </label>
    </div>
    <label>
      Address
      <textarea name="address" rows="3" required></textarea>
    </label>
    <div class="actions add-form-actions">
      <button class="btn primary" type="submit">Save vendor</button>
      <a class="btn ghost" href="{{ url_for('vendors') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
