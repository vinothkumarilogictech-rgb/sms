{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Edit staff</h1>
    <p>Update staff details and status.</p>
  </div>
  <a class="btn ghost js-back-button" href="{{ url_for('tailors') }}" data-fallback="{{ url_for('tailors') }}">Back</a>
</div>

<section class="card">
  <form class="stack" method="post">
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <div class="grid two">
      <label>
        Staff name
        <input type="text" name="name" value="{{ tailor.name }}" required>
      </label>
      <label>
        Staff role
        <select name="role" required>
          <option value="">-- Select role --</option>
          {% set ns = namespace(found=false) %}
          {% for r in staff_roles or [] %}
            {% if tailor.role == r.name %}{% set ns.found = true %}{% endif %}
            <option value="{{ r.name }}" {% if tailor.role == r.name %}selected{% endif %}>{{ r.name }}</option>
          {% endfor %}
          {% if tailor.role and not ns.found %}
            <option value="{{ tailor.role }}" selected>{{ tailor.role }}</option>
          {% endif %}
        </select>
      </label>
      <label>
        Phone number
        <input type="text" name="phone" value="{{ tailor.phone }}" inputmode="tel" pattern="^\+?[0-9]+$" oninput="this.value=this.value.replace(/[^0-9+]/g,'').replace(/(?!^)\+/g,'');" required>
      </label>
    </div>

    <label>Status</label>
    <div class="radio-group">
      <label>
        <input type="radio" name="status" value="Active" {% if tailor.status == "Active" %}checked{% endif %}> Active
      </label>
      <label>
        <input type="radio" name="status" value="Working" {% if tailor.status == "Working" %}checked{% endif %}> Working
      </label>
      <label>
        <input type="radio" name="status" value="Inactive" {% if tailor.status == "Inactive" %}checked{% endif %}> Inactive
      </label>
    </div>

    <div class="actions">
      <button type="submit" class="btn primary">Save changes</button>
      <a href="{{ url_for('tailors') }}" class="btn ghost">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
