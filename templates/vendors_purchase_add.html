<template id="purchase-item-template">
  <div class="material-row">
    <div>
      <select name="purchase_item_id" class="purchase-item-select">
        <option value="">Select item</option>
        {% for item in inventory %}
          <option value="{{ item.id }}" data-uom="{{ item.uom_name or '' }}">{{ item.name }} (Stock: {{ item.qty }})</option>
        {% endfor %}
      </select>
    </div>
    <div><input type="number" step="0.01" name="purchase_qty" value="1" min="0" /></div>
    <div class="material-uom">-</div>
    <div><input type="number" step="0.01" name="purchase_unit_price" value="0" min="0" /></div>
    <div><input type="number" step="0.01" name="purchase_selling_price" value="0" min="0" /></div>
    <div class="material-line-total">₹ 0.00</div>
    <div><button type="button" class="btn ghost material-remove">x</button></div>
  </div>
</template>

<script>
  const addBtn = document.getElementById("add-purchase-item");
  const purchaseList = document.getElementById("purchase-items");
  const purchaseTemplate = document.getElementById("purchase-item-template");
  const totalField = document.getElementById("purchase-total");

  function parseNumber(value) {
    const parsed = parseFloat(value);
    return Number.isFinite(parsed) ? parsed : 0;
  }

  function formatMoney(value) {
    return `₹ ${value.toFixed(2)}`;
  }

  function updateRow(row) {
    const select = row.querySelector(".purchase-item-select");
    const uomCell = row.querySelector(".material-uom");
    const qtyInput = row.querySelector('input[name="purchase_qty"]');
    const priceInput = row.querySelector('input[name="purchase_unit_price"]');
    const lineTotal = row.querySelector(".material-line-total");
    const uom = select?.selectedOptions?.[0]?.dataset?.uom || "-";
    if (uomCell) uomCell.textContent = uom || "-";
    const qty = parseNumber(qtyInput?.value);
    const price = parseNumber(priceInput?.value);
    const total = qty * price;
    if (lineTotal) lineTotal.textContent = formatMoney(total);
    return total;
  }

  function recalcTotals() {
    let total = 0;
    purchaseList.querySelectorAll(".material-row").forEach((row) => {
      if (row.classList.contains("material-head")) return;
      total += updateRow(row);
    });
    if (totalField) totalField.value = formatMoney(total);
  }

  function wireRow(row) {
    row.querySelectorAll("select, input").forEach((el) => {
      el.addEventListener("input", recalcTotals);
      el.addEventListener("change", recalcTotals);
    });
    const remove = row.querySelector(".material-remove");
    if (remove) {
      remove.addEventListener("click", () => {
        row.remove();
        recalcTotals();
      });
    }
  }

  if (addBtn && purchaseList && purchaseTemplate) {
    addBtn.addEventListener("click", () => {
      const clone = purchaseTemplate.content.cloneNode(true);
      const row = clone.querySelector(".material-row");
      if (row) wireRow(row);
      purchaseList.appendChild(clone);
      recalcTotals();
    });
  }

  document.querySelectorAll(".material-row").forEach((row) => {
    if (row.classList.contains("material-head")) return;
    wireRow(row);
  });

  recalcTotals();
</script>
{% endblock %}
