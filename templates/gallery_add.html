{% extends "base.html" %}
{% block content %}
<style>
  .add-form-card {
    background: linear-gradient(180deg, #eadbfb 0%, #e5d4f8 100%);
    border: 1px solid #dcbef0;
    border-radius: 22px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 16px 30px rgba(62, 11, 99, 0.08);
  }
  .add-form-stack > label,
  .add-form-grid label {
    gap: 8px;
    color: #3f2265;
    font-weight: 700;
  }
  .add-form-grid {
    margin-top: 4px;
  }
  .add-form-grid input,
  .add-form-grid select,
  .add-form-stack input[type="text"],
  .add-form-stack input[type="file"] {
    background: #fffdfd;
  }
  .add-form-actions {
    justify-content: flex-end;
  }
</style>
<div class="page-head">
  <div>
    <h1>Add gallery item</h1>
    <p>Upload a new piece to display on the gallery page.</p>
  </div>
  <a class="btn ghost js-back-button" href="{{ url_for('gallery') }}" data-fallback="{{ url_for('gallery') }}">Back</a>
</div>

<section class="card add-form-card">
  <form class="stack add-form-stack" method="post" enctype="multipart/form-data">
    <label>
      Category
      <div class="grid two add-form-grid">
        <select name="category_id">
          <option value="">Select category</option>
          {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
        <input type="text" name="category_name" placeholder="Or type new category" />
      </div>
    </label>

    <label>
      Image name (optional)
      <input type="text" name="item_name" placeholder="e.g., Pant 1">
    </label>

    <label>
      Upload images
      <input type="file" name="images" accept="image/*" multiple required>
    </label>

    <div class="actions add-form-actions">
      <button class="btn primary" type="submit">Save item</button>
      <a href="{{ url_for('gallery') }}" class="btn ghost">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
