{% extends "base.html" %}
{% block content %}
<style>
  .inv-shell {
    display: grid;
    gap: 10px;
    padding: 12px;
  }
  .add-form-card {
    background: linear-gradient(180deg, #eadbfb 0%, #e5d4f8 100%);
    border: 1px solid #dcbef0;
    border-radius: 22px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 16px 30px rgba(62, 11, 99, 0.08);
  }
  .inv-item {
    border: 1px solid #dcc4ef;
    border-radius: 18px;
    padding: 10px;
    background: #fffdfd;
    display: grid;
    gap: 8px;
  }
  .inv-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .inv-item-title {
    margin: 0;
    font-size: 0.98rem;
    color: #3f2265;
  }
  .inv-grid {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .inv-field {
    display: grid;
    gap: 4px;
  }
  .inv-field > span {
    font-size: 0.82rem;
    font-weight: 700;
    color: #5f4f75;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .inv-field input,
  .inv-field select {
    min-height: 36px;
    border: 1px solid #dcc4ef;
    border-radius: 10px;
    padding: 0.4rem 0.6rem;
    background: #fffdfd;
    color: #2d2140;
  }
  .inv-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
  }
  .inv-actions-left,
  .inv-actions-right {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  @media (max-width: 1100px) {
    .inv-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .inv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .inv-grid { grid-template-columns: 1fr; }
  }
  .paste-import-card {
    border: 1px dashed #cba6ea;
    border-radius: 18px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.55);
    display: grid;
    gap: 10px;
  }
  .paste-import-card h3 {
    margin: 0;
    color: #3f2265;
    font-size: 1rem;
  }
  .paste-import-card p {
    margin: 0;
    color: #5f4f75;
  }
  .paste-import-card textarea {
    width: 100%;
    min-height: 120px;
    border: 1px solid #dcc4ef;
    border-radius: 12px;
    padding: 0.75rem;
    resize: vertical;
    background: #fffdfd;
    color: #2d2140;
  }
</style>

<div class="page-head">
  <div>
    <h1>Add materials</h1>
  </div>
  <a class="btn ghost js-back-button" href="{{ url_for('inventory', tab='vehicles') }}" data-fallback="{{ url_for('inventory', tab='vehicles') }}">Back</a>
</div>

<section class="card inv-shell add-form-card">
  <form method="post" id="materials-add-form" class="inv-shell">
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}

    <section class="paste-import-card">
      <h3>Paste inventory rows</h3>
      <p>Paste tab-separated stock rows with a header like <code>InventoryCode</code>, <code>Description</code>, <code>UOM</code>, <code>VendorCode</code>, <code>UnitCost</code>, and <code>RetailPrice</code>.</p>
      <textarea id="paste-import-input" placeholder="Paste Excel or TSV rows here"></textarea>
      <div class="inv-actions">
        <div class="inv-actions-left">
          <button type="button" class="btn ghost hover-red-fill" id="import-paste-data">Import Pasted Rows</button>
          <button type="button" class="btn ghost" id="clear-paste-data">Clear</button>
        </div>
      </div>
    </section>

    <div id="inventory-items" class="inv-shell">
      <article class="inv-item" data-item-card>
        <div class="inv-item-head">
          <h3 class="inv-item-title" data-item-title>Item 1</h3>
          <button type="button" class="btn ghost hover-red-fill item-remove" aria-label="Remove item">Remove</button>
        </div>
        <div class="inv-grid">
          <label class="inv-field">
            <span>Item Name</span>
            <input type="text" name="item_name" required placeholder="Product">
          </label>
          <label class="inv-field">
            <span>Code</span>
            <input type="text" name="item_code" required placeholder="Enter code">
          </label>
          <label class="inv-field">
            <span>Source</span>
            <select name="item_vendor" required>
              <option value="">Select</option>
              <option value="Owner / Self Procured">Owner / Self Procured</option>
              <option value="Premier Products">Premier Products</option>
              {% for v in vendors %}
              <option value="{{ v.name }}">{{ v.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="inv-field">
            <span>UOM</span>
            <select name="item_uom_id" required>
              <option value="">Select</option>
              {% for u in uoms %}
              <option value="{{ u.id }}">{{ u.name }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="inv-field">
            <span>Qty</span>
            <input type="number" name="item_qty" required min="0" step="0.001" placeholder="Enter qty">
          </label>
          <label class="inv-field">
            <span>Cost</span>
            <input type="number" step="0.01" name="item_cost_price" required min="0" placeholder="Enter cost">
          </label>
          <label class="inv-field">
            <span>Selling</span>
            <input type="number" step="0.01" name="item_selling_price" required min="0" placeholder="Enter selling">
          </label>
        </div>
      </article>
    </div>

    <div class="inv-actions">
      <div class="inv-actions-left">
        <button type="button" class="btn ghost hover-red-fill" id="add-inventory-item">+ Add Item</button>
      </div>
      <div class="inv-actions-right">
        <button class="btn primary" type="submit">Save Items</button>
      </div>
    </div>
  </form>
</section>

<template id="inventory-item-template">
  <article class="inv-item" data-item-card>
    <div class="inv-item-head">
      <h3 class="inv-item-title" data-item-title>Item</h3>
      <button type="button" class="btn ghost hover-red-fill item-remove" aria-label="Remove item">Remove</button>
    </div>
    <div class="inv-grid">
      <label class="inv-field">
        <span>Item Name</span>
        <input type="text" name="item_name" required placeholder="Product">
      </label>
      <label class="inv-field">
        <span>Code</span>
        <input type="text" name="item_code" required placeholder="Enter code">
      </label>
      <label class="inv-field">
        <span>Source</span>
        <select name="item_vendor" required>
          <option value="">Select</option>
          <option value="Owner / Self Procured">Owner / Self Procured</option>
          <option value="Premier Products">Premier Products</option>
          {% for v in vendors %}
          <option value="{{ v.name }}">{{ v.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="inv-field">
        <span>UOM</span>
        <select name="item_uom_id" required>
          <option value="">Select</option>
          {% for u in uoms %}
          <option value="{{ u.id }}">{{ u.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="inv-field">
        <span>Qty</span>
        <input type="number" name="item_qty" required min="0" step="0.001" placeholder="Enter qty">
      </label>
      <label class="inv-field">
        <span>Cost</span>
        <input type="number" step="0.01" name="item_cost_price" required min="0" placeholder="Enter cost">
      </label>
      <label class="inv-field">
        <span>Selling</span>
        <input type="number" step="0.01" name="item_selling_price" required min="0" placeholder="Enter selling">
      </label>
    </div>
  </article>
</template>

<script>
  const addBtn = document.getElementById("add-inventory-item");
  const list = document.getElementById("inventory-items");
  const template = document.getElementById("inventory-item-template");
  const pasteInput = document.getElementById("paste-import-input");
  const importBtn = document.getElementById("import-paste-data");
  const clearPasteBtn = document.getElementById("clear-paste-data");

  function syncItemState() {
    if (!list) return;
    const cards = Array.from(list.querySelectorAll("[data-item-card]"));
    cards.forEach((card, index) => {
      const title = card.querySelector("[data-item-title]");
      if (title) title.textContent = `Item ${index + 1}`;
      const removeBtn = card.querySelector(".item-remove");
      if (removeBtn) removeBtn.disabled = cards.length === 1;
    });
  }

  function normalizeKey(value) {
    return (value || "").toString().trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
  }

  function createItemCard() {
    if (!list || !template) return null;
    const fragment = template.content.cloneNode(true);
    const card = fragment.querySelector("[data-item-card]");
    list.appendChild(fragment);
    syncItemState();
    return list.querySelector("[data-item-card]:last-child");
  }

  function setInputValue(card, selector, value) {
    const input = card ? card.querySelector(selector) : null;
    if (input) input.value = value ?? "";
  }

  function setSelectByTextOrValue(select, rawValue) {
    if (!select) return;
    const target = (rawValue || "").trim();
    if (!target) {
      select.value = "";
      return;
    }
    const normalizedTarget = target.toLowerCase();
    const existingOption = Array.from(select.options).find((option) => {
      return option.value.toLowerCase() === normalizedTarget || option.textContent.trim().toLowerCase() === normalizedTarget;
    });
    if (existingOption) {
      select.value = existingOption.value;
      return;
    }
    const option = document.createElement("option");
    option.value = target;
    option.textContent = target;
    select.appendChild(option);
    select.value = target;
  }

  function pickMappedValue(row, keys) {
    for (const key of keys) {
      const normalized = normalizeKey(key);
      if (normalized in row && row[normalized] !== "") {
        return row[normalized];
      }
    }
    return "";
  }

  function pickNumber(row, keys, fallback = "0") {
    for (const key of keys) {
      const value = pickMappedValue(row, [key]);
      if (value === "") continue;
      const parsed = parseFloat(String(value).replace(/,/g, ""));
      if (!Number.isNaN(parsed)) return parsed.toFixed(2);
    }
    return fallback;
  }

  function pickQty(row) {
    const candidates = [
      "LstStkTakQty",
      "FirstInQty",
      "MidInQty",
      "LastInQty",
      "MinimumQtyLevel",
      "ReOrderLevel",
    ];
    for (const key of candidates) {
      const value = pickMappedValue(row, [key]);
      if (value === "") continue;
      const parsed = parseFloat(String(value).replace(/,/g, ""));
      if (!Number.isNaN(parsed) && parsed >= 0) return parsed.toFixed(3);
    }
    return "0.000";
  }

  function parsePasteRows(rawText) {
    const lines = rawText
      .split(/\r?\n/)
      .map((line) => line.trimEnd())
      .filter((line) => line.trim());
    if (lines.length < 2) return [];

    const headers = lines[0].split("\t").map((header) => normalizeKey(header));
    return lines.slice(1).map((line) => {
      const cells = line.split("\t");
      const row = {};
      headers.forEach((header, index) => {
        row[header] = (cells[index] || "").trim();
      });
      return row;
    }).filter((row) => Object.values(row).some((value) => value));
  }

  function fillCardFromRow(card, row) {
    if (!card) return;
    setInputValue(card, 'input[name="item_name"]', pickMappedValue(row, ["Description", "ShortDescription", "Model"]));
    setInputValue(card, 'input[name="item_code"]', pickMappedValue(row, ["InventoryCode", "Barcode", "GTINCode"]));
    setInputValue(card, 'input[name="item_qty"]', pickQty(row));
    setInputValue(card, 'input[name="item_cost_price"]', pickNumber(row, ["UnitCost", "AverageCost", "LastInCost", "MidInCost", "FirstInCost"], "0.00"));

    const selling = pickNumber(row, ["RetailPrice", "SellingPrice", "MRP", "PromotionPrice", "DistributionPrice"], "0.00");
    setInputValue(card, 'input[name="item_selling_price"]', selling);

    const vendorSelect = card.querySelector('select[name="item_vendor"]');
    const uomSelect = card.querySelector('select[name="item_uom_id"]');
    setSelectByTextOrValue(vendorSelect, pickMappedValue(row, ["VendorCode", "BrandCode", "DepartmentCode"]));
    setSelectByTextOrValue(uomSelect, pickMappedValue(row, ["UOM"]));
  }

  if (addBtn && list && template) {
    addBtn.addEventListener("click", () => {
      list.appendChild(template.content.cloneNode(true));
      syncItemState();
    });
  }

  if (importBtn && pasteInput && list) {
    importBtn.addEventListener("click", () => {
      const rows = parsePasteRows(pasteInput.value);
      if (!rows.length) {
        window.alert("Paste at least one header row and one data row.");
        return;
      }

      const cards = Array.from(list.querySelectorAll("[data-item-card]"));
      const firstCard = cards[0] || createItemCard();
      if (!firstCard) return;

      fillCardFromRow(firstCard, rows[0]);
      rows.slice(1).forEach((row) => {
        const card = createItemCard();
        fillCardFromRow(card, row);
      });
      syncItemState();
    });
  }

  if (clearPasteBtn && pasteInput) {
    clearPasteBtn.addEventListener("click", () => {
      pasteInput.value = "";
      pasteInput.focus();
    });
  }

  document.addEventListener("click", (event) => {
    const btn = event.target.closest(".item-remove");
    if (!btn) return;
    const card = btn.closest("[data-item-card]");
    if (card) {
      card.remove();
      syncItemState();
    }
  });

  syncItemState();
</script>
{% endblock %}
